# Channel declaration for Tutorial_06.
# Both agents run on localhost; the server listens on 6667.

protocol = Tutorial_06

role.client.ip = 127.0.0.1
role.server.ip = 127.0.0.1
role.server.port = 6669

# Directional channels. Each maps a source role to a destination role.
channel.client_server.src = client
channel.client_server.dst = server
channel.client_server.port = 6669

channel.server_client.src = server
channel.server_client.dst = client
channel.server_client.port = 6669