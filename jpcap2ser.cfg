# Configuration file for the AnBx reconstruction pipeline

[DEFAULT]
# -------------------- Paths (replace placeholders with paths for your environment) --------------------
# Base path where Java files are generated
BASE_PATH = <JAVA_GENERATION_DIRECTORY>

# Base directory for the AnBx/OFMC distribution
BASEDIR = <ANBX_OFMC_DISTRIBUTION_DIRECTORY>

# Path to the jcryptgrabber tools (jpcap2ser, outparse, etc.)
TOOLBASEDIR = <JPCAP2SER_TOOL_DIRECTORY>

# Protocol files directory
PROT_FOLDER = <PROTOCOL_SPECIFICATIONS_DIRECTORY>

# Output and log folders
LOG_FOLDER = <LOG_DIRECTORY>
OUTPUT_FOLDER = <OUTPUT_DIRECTORY>

# AnBx distribution version (used for naming)
DIST = 2026.07

# -------------------- Tools --------------------
# Path to Apache Ant
ANT_CMD = <APACHE_ANT_EXECUTABLE>

# TShark File Location
TSHARK_CMD = <TSHARK_EXECUTABLE>

# Serialization Dumper File Location
SERDUMP_JAR_FILE = <SERIALIZATION_DUMPER_JAR>

# -------------------- File Suffixes and Extensions --------------------
SERDUMP_SUFFIX_EXT = _DUMP.txt
PCAP_SUFFIX_EXT = _DY.pcap

# -------------------- Output Formatting --------------------
FILENAMEFORMAT = anbx
OUTTYPE = ser
OUTFORMAT = stream

# -------------------- Pipeline Control --------------------
# Note: {basedir}, {protocol}, {src_folder} are replaced by the Python script
PCAP_CAPTURE_COMMAND = cd {basedir}anbx-dist && call run_javadocker {protocol}
OBJCHECK_COMMAND = cd {basedir} && {ant_cmd} -buildfile {src_folder}/build.xml objcheck
RUN_JAVA_COMMAND = cd {basedir} && {ant_cmd} -buildfile {src_folder}/build.xml runagents

# -------------------- Protocol Filtering --------------------
# Comma-separated list of protocols to exclude from batch runs
EXCLUDE_PROTOCOLS = BIP70,Bullet_Channel,Bullet_Channel_2,Bullet_Channel_2_Secure,Bullet_Channel_3_Secure,Bullet_Channel_Expansion_Auth,Bullet_Channel_Expansion_Secret,Bullet_Channel_Expansion_Secure,emv_visa_k3,emv_visa_k3_pseudo,Latex_Test,ob_aisp_protocol,SSO,TLS_noClientAuth,TLS_pw
