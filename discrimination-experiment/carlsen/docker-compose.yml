services:
    Carlsen_init:
        image: anbx:1.0.0
        container_name: Carlsen_init
        build:
            context: .
            dockerfile: Dockerfile
        tty: true
        stdin_open: true
        cap_add:
            - NET_ADMIN
        volumes:
        - ./../../../:/app
        command: >
            sh -c "/usr/bin/timeout 60 ant  -buildfile /app/genAnBx/src/carlsen/build.xml runinit"
        network_mode: none
  
    Carlsen_B:
        image: anbx:1.0.0
        container_name: Carlsen_container_B
        healthcheck:
            test: ["CMD", "ping", "-c", "2", "10.0.2.2"]
            interval: 3s
            timeout: 3s
            retries: 30
        
        
        
        
        

        tty: true
        sysctls:
        - net.ipv4.ip_forward=1
        stdin_open: true
        cap_add:
            - NET_ADMIN
        volumes:
            - ./../../../:/app
        command: >
            sh -c "ip route del default &&
                   ip route add default via 10.0.2.253 &&
                   ip route list &&
                   ping 10.0.2.253 -c 1 > /dev/null &&
                   # 
                   /usr/bin/timeout 60 ant  -buildfile /app/genAnBx/src/carlsen/build.xml ROLE_B && 
                   sleep 0"
        networks:
            net-B:
                ipv4_address: 10.0.2.2
        expose:
            - "55555"
        depends_on:
            Carlsen_DY_intruder:
                condition: service_healthy
        
