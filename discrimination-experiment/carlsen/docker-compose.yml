    Carlsen_DY_intruder:
        image: anbx_dy:1.0.0
        container_name: Carlsen_container_DY
        healthcheck:
            test: ["CMD", "ping", "-c", "2", "10.0.2.253"]
            interval: 3s
            timeout: 3s
            retries: 30
        build:
            context: .
            dockerfile: Dockerfile_DY
        
        
        
        tty: true
        sysctls:
        - net.ipv4.ip_forward=1
        stdin_open: true
        cap_add:
            - NET_ADMIN
        volumes:
        - ./../../../:/app
        command: >
            sh -c "ip route list > /dev/null && 
                    
                   
                   # 
                    
                   # let the agents start up
                   sleep 3 &&
                   /usr/bin/timeout 60 sh -c 'while true; do
                       # Check availability of services using ping
                       ping -c 1 10.0.2.2 > /dev/null && \
                       ping -c 1 10.0.3.2 > /dev/null && \
                       ping -c 1 10.0.1.2 > /dev/null || break
                   sleep 3 
                   done'
                   "
        networks:
                net-B:
                    ipv4_address: 10.0.2.253
                net-s:
                    ipv4_address: 10.0.3.253
                net-A:
                    ipv4_address: 10.0.1.253
        depends_on:
            Carlsen_init:
                condition: service_completed_successfully

